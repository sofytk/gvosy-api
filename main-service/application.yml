server:
  port: 8089

spring:
  application:
    name: main-service

  datasource:
    url: jdbc:postgresql://localhost:5432/users_database
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update #dev mode
    show-sql: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true