server:
  port: 8761

spring:
  application:
    name: eureka-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    hostname: eureka-service
    prefer-ip-address: true
  server:
    enable-self-preservation: false